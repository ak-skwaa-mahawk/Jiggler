[package]
name = "tordial_gs_manifold"
version = "0.1.0"
edition = "2021"

[lib]
name = "tordial_gs_manifold"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ndarray = "0.15"
numpy = "0.21"
prost = "0.12"
tonic = "0.11"

[dependencies.pyo3]
version = "0.21"
features = ["extension-module"]

[build-dependencies]
tonic-build = "0.11"
prost-build = "0.12"
