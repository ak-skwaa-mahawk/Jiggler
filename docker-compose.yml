services:
  tordial-router:
    build:
      context: .
      dockerfile: Dockerfile
    image: tordial/trp-control-plane:v9.0
    container_name: tordial-router
    restart: unless-stopped
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - HEADLESS=1
      - PYTHONUNBUFFERED=1
    volumes:
      - tordial-state:/var/lib/tordial
      - /etc/wireguard:/etc/wireguard:ro

volumes:
  tordial-state:
    driver: local
