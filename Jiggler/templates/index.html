<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tordial GS Manifold — Hyper-Grid Visualizer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #030305; color: #00ffcc; font-family: 'Courier New', Courier, monospace; }
        #overlay { 
            position: absolute; top: 20px; left: 20px; z-index: 100; pointer-events: none; 
            background: rgba(5, 5, 10, 0.85); padding: 16px 20px; border: 1px solid #00ffcc; 
            border-radius: 4px; box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }
        h2 { margin: 0 0 10px 0; font-size: 14px; letter-spacing: 1.5px; color: #ffffff; text-transform: uppercase; }
        .metric { margin: 4px 0; font-size: 12px; }
        .val { color: #ffffff; font-weight: bold; }
        #canvas-container { width: 100vw; height: 100vh; }
    </style>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="overlay">
        <h2>TORDIAL GS MANIFOLD // SUBSTRATE MONITOR</h2>
        <div class="metric">Batch Size: <span id="telemetry-iterations" class="val">0</span></div>
        <div class="metric">Batch Time: <span id="telemetry-time" class="val">0.00</span> ms</div>
        <div class="metric">Throughput: <span id="telemetry-throughput" class="val">0.00</span> iter/s</div>
        <div class="metric">Mean Speed: <span id="telemetry-speed" class="val">0.00</span> ns/pass</div>
        <div class="metric">Out-of-Bounds Trips: <span id="telemetry-violations" class="val">0</span></div>
    </div>
    <div id="canvas-container"></div>

    <script>
        const socket = io();
        const iterationsEl = document.getElementById('telemetry-iterations');
        const timeEl = document.getElementById('telemetry-time');
        const throughputEl = document.getElementById('telemetry-throughput');
        const speedEl = document.getElementById('telemetry-speed');
        const violationsEl = document.getElementById('telemetry-violations');

        // Three.js Scene Setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Particle System for Hyper-Grid Dynamics
        const particleCount = 15000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 12;
            positions[i+1] = (Math.random() - 0.5) * 12;
            positions[i+2] = (Math.random() - 0.5) * 12;
            
            colors[i] = 0.0; 
            colors[i+1] = 1.0; 
            colors[i+2] = 0.8;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({ size: 0.04, vertexColors: true, transparent: true, opacity: 0.85 });
        const points = new THREE.Points(geometry, material);
        scene.add(points);

        camera.position.z = 10;

        // SocketIO Real-time Pipeline Reader
        socket.on('telemetry_update', (data) => {
            iterationsEl.innerText = data.iterations.toLocaleString();
            timeEl.innerText = data.batch_time_ms.toFixed(3);
            throughputEl.innerText = data.throughput.toLocaleString(undefined, {maximumFractionDigits: 0});
            speedEl.innerText = data.per_pass_ns.toFixed(2);
            violationsEl.innerText = data.violations.toLocaleString();

            // Dynamic color modulation based on breach ratio
            const violationRatio = Math.min(data.violations / (data.iterations * 0.25), 1.0);
            const colorAttr = geometry.attributes.color;
            
            for (let i = 0; i < particleCount; i++) {
                colorAttr.setX(i, violationRatio);              // Shift Red on High Breach
                colorAttr.setY(i, 1.0 - (violationRatio * 0.5)); // Preserve cyan accent
                colorAttr.setZ(i, 0.8 - (violationRatio * 0.8));
            }
            colorAttr.needsUpdate = true;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            points.rotation.y += 0.003;
            points.rotation.x += 0.001;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
